<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="only light" />
  <title>Dr. Cho - EN - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
  
  <style>
    /* ============================================================
    main-en-index.css - Dr. Cho | EN Sub Landing Page (Bento Box)
    100% Smooth Continuous Scaling (Zero Breakpoint Steps)
    ============================================================ */

    *, *::before, *::after {
        font-family: 'Nanum Myeongjo', 'Georgia', 'Times New Roman', sans-serif;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        color-scheme: only light;
        --bg:        #F7F6F2;
        --txt:       #1A1A18;
        --txt-muted: #8A8880;
        --rule:      #D8D6D0;

        --card-bg:   #EAE8E0;
        --card-hover-bg: #DFDCD1;
    }

    html, body {
      min-height: 100vh;
    }

    body {
      background-color: var(--bg);
      color: var(--txt);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(1rem, 2vh, 2rem) clamp(1rem, 2vw, 2rem);
      position: relative;
      overflow-x: hidden;
    }

    /* ── Subtle Grain Overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.18'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    /* ── 1. 상단 네비게이션 ── */
    .top-nav {
        width: 100%;
        max-width: clamp(440px, 52vw, 760px);
        display: flex;
        justify-content: flex-end;
        padding: 0;
        position: relative;
        z-index: 1;
        font-size: clamp(0.75rem, 1.1vw, 0.95rem);
        letter-spacing: 0.05em;
        margin-bottom: clamp(0.3rem, 1vh, 0.5rem);
    }

    .top-nav a {
        color: var(--txt-muted);
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .top-nav a:hover {
        color: var(--txt);
        font-weight: 700;
    }

    /* ── 2. 상단 타이틀 섹션 ── */
    .hero-section {
        text-align: center;
        margin-top: 0;
        margin-bottom: clamp(1rem, 2.2vh, 1.8rem);
        position: relative;
        z-index: 1;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hero-title {
        font-size: clamp(1.4rem, 2.8vw, 2.4rem);
        font-weight: 700;
        margin-bottom: clamp(0.2rem, 0.5vh, 0.35rem);
        letter-spacing: -0.02em;
    }

    .hero-subtitle {
        font-size: clamp(0.8rem, 1.4vw, 1.15rem);
        font-weight: 400;
        margin: 0;
        color: var(--txt-muted);
        letter-spacing: 0.05em;
    }

    /* ── 3. 벤토 박스 (연속 유동형 그리드) ── */
    .bento-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: clamp(8px, 1.3vw, 16px);
        width: 100%;
        max-width: clamp(440px, 52vw, 760px);
        position: relative;
        z-index: 1;
        margin-bottom: clamp(0.5rem, 1.5vh, 1rem);
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .bento-item {
        background-color: var(--card-bg);
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        color: var(--txt);
        position: relative;
        transition: background-color 0.4s ease;
        padding: clamp(0.3rem, 0.8vw, 0.6rem);
        aspect-ratio: 2.8 / 1; /* 전 구간 2.8:1 비율 완벽 고정 */
        overflow: hidden;
    }

    .empty-card {
      cursor: default;
    }

    .bento-item:hover {
        background-color: var(--card-hover-bg);
    }

    .card-text {
        font-size: clamp(0.75rem, 1.6vw, 1.3rem);
        font-weight: 400;
        position: relative;
        transition: transform 0.25s ease;
        white-space: nowrap;
    }

    .bento-item:hover .card-text {
        transform: translateY(-3px);
    }

    .card-text::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -0.1rem;
        height: 1px;
        background: var(--txt);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bento-item:hover .card-text::after {
        transform: scaleX(1);
    }

    /* ── Corner mark ── */
    .corner-mark {
        position: fixed;
        bottom: 1.5rem;
        right: 2rem;
        font-size: 0.55rem;
        letter-spacing: 0.12em;
        color: #D8D6D0;
        text-transform: uppercase;
        z-index: 100;
        animation: fadeUp 1s ease 1s both;
    }

    /* --- Animations --- */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<div id="site-footer-placeholder"></div>

</body>
</html>
