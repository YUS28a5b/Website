<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Cho - Blog</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
  
  <style>
    /* ============================================================
       Blog Page CSS
    ============================================================ */

    *, *::before, *::after { box-sizing: border-box; }

    body {
        font-family: 'Nanum Myeongjo', 'Georgia', 'Times New Roman', serif;
        color: #1A1A18;
        background-color: #F7F6F2;
        line-height: 1.9;
        margin: 0;
        padding: 0;
    }

    button, input, select, textarea, a {
        font-family: 'Nanum Myeongjo', 'Georgia', 'Times New Roman', serif;
    }

    /* ── Animations ── */
    .reveal {
        opacity: 0;
        animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
        will-change: transform, opacity;
    }

    .reveal-1 { animation-delay: 0.30s; } 
    .reveal-2 { animation-delay: 0.45s; } 

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ── Blog Layout & Sidebar ── */
    .blog-container {
        max-width: 1050px;
        margin: 0 auto;
        padding: 0 20px 60px 20px;
    }

    .sidebar-toggle-bar {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #D8D6D0;
    }

    .hamburger-btn {
        background: transparent;
        border: 1px solid #D8D6D0;
        border-radius: 4px;
        padding: 5px 12px;
        font-size: 0.72rem;
        font-weight: 700;
        color: #1A1A18;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    .hamburger-btn:hover {
        background: #1A1A18;
        color: #F7F6F2;
        border-color: #1A1A18;
    }

    .hamburger-icon { font-size: 0.95rem; line-height: 1; }

    .blog-main-layout {
        display: flex;
        gap: 36px;
        align-items: flex-start;
        transition: all 0.4s ease;
    }

    /* 사이드바 스타일 */
    .category-sidebar {
        width: 200px;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid #D8D6D0;
        border-radius: 4px;
        padding: 16px 16px; 
        transition: all 0.35s ease;
        overflow: hidden;
    }

    .category-sidebar.collapsed {
        width: 0;
        padding: 0;
        border: none;
        opacity: 0;
        pointer-events: none;
        margin-right: -36px;
    }

    .sidebar-title {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8A8880;
        margin: 0 0 10px 0;
        padding-bottom: 6px;
        border-bottom: 1px solid #D8D6D0;
    }

    .category-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 4px; 
    }

    .category-item {
        font-size: 0.85rem;
        font-weight: 500;
        color: #8A8880;
        text-decoration: none;
        display: block;
        padding: 4px 8px; 
        border-radius: 3px;
        transition: all 0.25s ease;
        cursor: pointer;
    }

    .category-item:hover {
        color: #1A1A18;
        background: rgba(26, 26, 24, 0.05);
        padding-left: 12px;
    }

    .category-item.active {
        color: #1A1A18;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.8);
        border-left: 2px solid #1A1A18;
    }

    /* 우측 게시글 스타일 */
    .journal-section {
        flex-grow: 1;
        width: 100%;
    }

    .journal-entry {
        background: rgba(255, 255, 255, 0.6);
        padding: 2.2rem 2rem;
        margin-bottom: 1.5rem;
        border: 1px solid #D8D6D0;
        border-radius: 4px;
        transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        animation: fadeUp 0.5s ease both;
    }

    .journal-entry:hover {
        transform: translateY(-2px);
        border-color: #1A1A18;
        background: rgba(255, 255, 255, 0.9);
    }

    .journal-entry:last-child {
        margin-bottom: 0;
    }

    .journal-meta {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.03em; 
        color: #8A8880;
        margin-bottom: 0.9rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
        text-transform: uppercase;
    }

    .journal-category { color: #1A1A18; }
    .journal-category::before { content: '•'; margin-right: 0.6rem; color: #D8D6D0; }

    .journal-title {
        font-size: 1.85rem;
        font-weight: 700;
        color: #1A1A18;
        letter-spacing: -0.02em;
        margin: 0 0 0.9rem 0;
        line-height: 1.3;
    }

    .journal-excerpt {
        font-size: 1.02rem;
        color: #1A1A18;
        line-height: 1.8;
        margin-bottom: 1.3rem;
    }

    .read-more-btn {
        display: inline-flex;
        align-items: center;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #1A1A18;
        text-decoration: none;
        transition: opacity 0.3s ease;
    }

    .read-more-btn:hover { opacity: 0.6; }
    .read-more-btn .arrow { margin-left: 0.4rem; transition: margin-left 0.3s ease; }
    .read-more-btn:hover .arrow { margin-left: 0.7rem; }

    /* ── Pagination ── */
    .pagination {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 3rem;
    }

    .page-btn {
        background: none;
        border: 1px solid #D8D6D0;
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        cursor: pointer;
        color: #1A1A18;
        transition: all 0.3s ease;
        border-radius: 4px;
    }

    .page-btn:hover { background: rgba(0,0,0,0.03); }
    .page-btn.active {
        background: #1A1A18;
        color: #F7F6F2;
        border-color: #1A1A18;
    }

    @media (max-width: 850px) {
        .blog-main-layout { flex-direction: column; gap: 20px; }
        .category-sidebar { width: 100%; }
        .category-sidebar.collapsed {
            width: 100%; height: 0; padding: 0; margin-right: 0; margin-bottom: 0;
        }
    }

    /* ── Contact Section ── */
    .contact-section {
        text-align: center;
        padding: 90px 20px 50px 20px;
        background-color: #1A1A18;
        color: #F7F6F2;
    }

    .contact-section h2 {
        font-size: 2rem;
        font-weight: 400;
        padding-bottom: 12px;
        margin-bottom: 30px;
        color: #F7F6F2;
        border-bottom: 1px solid rgba(216, 214, 208, 0.3);
        display: inline-block;
    }

    .contact-button {
        display: block;
        margin: 0 auto;
        background: #F7F6F2;
        color: #1A1A18;
        padding: 14px 36px;
        border: 1px solid #F7F6F2;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 25px;
        transition: all 0.3s ease;
    }

    .contact-button:hover { background: transparent; color: #F7F6F2; }
  </style>
</head>

<body>

    <div id="header-placeholder"></div>

    <script>
        window.bannerConfig = {
            title: "Journal & Insights",
            subtitle: "Thoughts on audiology, sound engineering, and a life in between.",
            media: [ 'images/blog-banner.jpg' ]
        };
    </script>
    <div id="banner-placeholder"></div>

    <main class="blog-container reveal reveal-1">
        <div class="sidebar-toggle-bar">
            <button class="hamburger-btn" id="sidebarToggleBtn" aria-label="Toggle Categories">
                <span class="hamburger-icon">☰</span>
                <span>Categories</span>
            </button>
        </div>

        <div class="blog-main-layout">
            <aside class="category-sidebar" id="categorySidebar">
                <h3 class="sidebar-title">Categories</h3>
                <ul class="category-list" id="category-list">
                    <!-- 자바스크립트가 자동으로 카테고리 탭을 생성합니다 -->
                </ul>
            </aside>

            <section class="journal-section">
                <!-- 자바스크립트가 자동으로 포스트 카드를 생성합니다 -->
                <div id="dynamic-blog-feed"></div>
                <!-- 페이지네이션 컨트롤 -->
                <div class="pagination" id="pagination-controls"></div>
            </section>
        </div>
    </main>

    <footer class="contact-section reveal reveal-2">
        <h2>Read more on our insights?</h2>
        <button class="contact-button" onclick="window.location.href='contact.html'">Subscribe to Newsletter</button>
    </footer>

    <div id="site-footer-placeholder"></div>
    <div id="footer-placeholder"></div>

    <script> window.componentPath = "../StructureAssest/"; </script>
    <script src="../StructureAssest/includes.js"></script>
    
    <!-- 💡 블로그 전용 데이터베이스 연결 -->
    <script src="../StructureAssest/blog-post-data.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.getElementById('categorySidebar');
            const toggleBtn = document.getElementById('sidebarToggleBtn');
            const feedContainer = document.getElementById('dynamic-blog-feed');
            const filterContainer = document.getElementById('category-list');
            const paginationContainer = document.getElementById('pagination-controls');

            if (!feedContainer || typeof blogPosts === 'undefined') return;

            function initSidebarState() {
                if (window.innerWidth <= 850) sidebar.classList.add('collapsed');
                else sidebar.classList.remove('collapsed');
            }
            initSidebarState();

            toggleBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

            const ITEMS_PER_PAGE = 7;
            let currentPage = 1;
            let currentCategory = "All Posts";

            function renderFilters() {
                const tags = ["All Posts", ...new Set(blogPosts.map(post => post.tag))];
                filterContainer.innerHTML = "";
                
                tags.forEach(tag => {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    a.className = `category-item ${tag === currentCategory ? 'active' : ''}`;
                    a.textContent = tag;
                    
                    a.addEventListener("click", (e) => {
                        e.preventDefault();
                        currentCategory = tag;
                        currentPage = 1; 
                        renderFeed();
                        renderFilters();
                        if (window.innerWidth <= 850) sidebar.classList.add("collapsed");
                    });
                    
                    li.appendChild(a);
                    filterContainer.appendChild(li);
                });
            }

            function renderFeed() {
                const filteredPosts = currentCategory === "All Posts" 
                    ? blogPosts 
                    : blogPosts.filter(post => post.tag === currentCategory);

                const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
                const paginatedPosts = filteredPosts.slice(startIndex, startIndex + ITEMS_PER_PAGE);

                feedContainer.innerHTML = "";

                if (paginatedPosts.length === 0) {
                    feedContainer.innerHTML = "<p>No posts found in this category.</p>";
                } else {
                    paginatedPosts.forEach((post, index) => {
                        const article = document.createElement("article");
                        article.className = "journal-entry";
                        article.style.animationDelay = `${index * 0.1}s`; 
                        
                        article.innerHTML = `
                            <div class="journal-meta">
                                <span class="journal-date">${post.date}</span>
                                <span class="journal-category">${post.tag}</span>
                            </div>
                            <h2 class="journal-title">${post.title}</h2>
                            <p class="journal-excerpt">${post.excerpt}</p>
                            <a href="${post.link}" class="read-more-btn">Read Article <span class="arrow">→</span></a>
                        `;
                        feedContainer.appendChild(article);
                    });
                }

                renderPagination(filteredPosts.length);
            }

            function renderPagination(totalItems) {
                paginationContainer.innerHTML = "";
                const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

                if (totalPages <= 1) return; 

                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement("button");
                    btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                    btn.textContent = i;
                    btn.addEventListener("click", () => {
                        currentPage = i;
                        renderFeed();
                        window.scrollTo({ top: 0, behavior: 'smooth' }); 
                    });
                    paginationContainer.appendChild(btn);
                }
            }

            renderFilters();
            renderFeed();
        });
    </script>
</body>
</html>
