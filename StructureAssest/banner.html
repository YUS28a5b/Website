<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap');

  /* 💡 배너 컨테이너 초기 숨김 */
  #banner-placeholder {
    opacity: 0;
    width: 100%;
    display: block;
  }

  /* 💡 조립 완료 후 페이드인 */
  #banner-placeholder.loaded {
    animation: bannerFadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes bannerFadeUp {
    0% {
      opacity: 0;
      transform: translateY(18px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 💡 배너 섹션: 상하 패딩 100px 적용 및 중앙 수직/수평 정렬 */
  .banner-section {
    position: relative;
    padding: 100px 20px;      /* 상하 패딩 100px로 확대하여 시원한 높이감 확보 */
    margin-bottom: 30px;
    border-bottom: 1px solid #D8D6D0;
    text-align: center;
    color: #1A1A18;
    overflow: hidden;
    background-color: rgba(0, 0, 0, 0.02);
    display: flex;
    flex-direction: column;
    justify-content: center;  /* 수직 중앙 정렬 */
    align-items: center;      /* 수평 중앙 정렬 */
  }

  .banner-bg-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background-color: #F7F6F2;
  }

  /* 영상 & 이미지 공통 클래스 */
  .banner-media {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
  }

  .banner-media.active {
    opacity: 0.3; /* 배경으로 은은하게 깔리는 반투명도 */
  }

  /* 💡 텍스트 콘텐츠 상자 재정렬 */
  .banner-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    max-width: 800px;
    margin: 0 auto;
  }

  /* 💡 타이틀 텍스트 스타일 */
  .banner-section h1 {
    font-family: 'Nanum Myeongjo', serif !important;
    font-size: 3rem;
    margin: 0 0 14px 0;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  /* 💡 서브타이틀 텍스트 스타일 */
  .banner-section .subtitle {
    font-family: 'Nanum Myeongjo', serif !important;
    font-size: 1.1rem;
    color: #8A8880;
    margin: 0;
    line-height: 1.6;
  }
</style>

<header class="banner-section">
  <div class="banner-bg-container"></div>
  <div class="banner-content">
    <h1 id="banner-title">Loading...</h1>
    <p id="banner-subtitle" class="subtitle"></p>
  </div>
</header>
